name: windows
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --workspace
      # Exercises the real Windows media-session API. A hosted runner has no player open, so this
      # only proves the integration is reachable; it is informational and must not block the build.
      - name: Windows media API smoke test
        continue-on-error: true
        run: cargo test -p islet -- --ignored --nocapture
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: islet-windows-installer
          path: target/release/bundle/nsis/*.exe
