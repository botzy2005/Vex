[package]
name = "vex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VEX: a Dynamic Island for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vex-core = { path = "../crates/vex-core" }
ureq = "2"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager for API keys
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_System_DataExchange", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
