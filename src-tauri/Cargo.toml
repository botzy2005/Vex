[package]
name = "islet"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Islet: a Dynamic Island for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
islet-core = { path = "../crates/islet-core" }
