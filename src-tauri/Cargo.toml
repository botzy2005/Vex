[package]
name = "vex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VEX: a Dynamic Island for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# Native "save as" and "choose folder" dialogs for screenshots.
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vex-core = { path = "../crates/vex-core" }
ureq = "2"

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager for API keys
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-core = "0.62"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[dev-dependencies]
tempfile = "3"
