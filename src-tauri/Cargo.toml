[package]
name = "vex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VEX: a Dynamic Island for Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
# Native "save as" and "choose folder" dialogs for screenshots.
tauri-plugin-dialog = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vex-core = { path = "../crates/vex-core" }
ureq = "2"
mdns-sd = "0.22.0"
qrcode = "0.15.0"
if-addrs = "0.15.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "0.14.10"
sha2 = "0.10"
vex-link = { version = "0.1.0", path = "../crates/vex-link" }

[target.'cfg(windows)'.dependencies]
# Windows Credential Manager for API keys
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-core = "0.62"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Win32_System_Com", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Power", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["test-util"] }
