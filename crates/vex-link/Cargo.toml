[package]
name = "vex-link"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "VEX Link: sans-IO device pairing and encrypted session protocol shared by VEX Desktop and VEX Connect for Android."

[dependencies]
# Noise protocol framework (pure-Rust crypto backend: no C code, so it cross-compiles to Android unchanged).
snow = { version = "0.9", default-features = false, features = ["default-resolver"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
zeroize = "1"

[dev-dependencies]
