[package]
name = "vex-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Platform-neutral core of VEX: settings schema, persistence and window placement math."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
# PNG for clipboard images (already part of the dependency tree through Tauri).
png = "0.18"
# Baseline JPEG encoder for saving screenshots as .jpg (pure Rust, no further dependencies).
jpeg-encoder = "0.6"

[dev-dependencies]
tempfile = "3"
